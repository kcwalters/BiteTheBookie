on:
  push:
    branches:
    - master
env:
  DOTNET_CORE_VERSION: 7.0.x
  CONTAINER_APP_NAME: bitethebookie-container-app
  CONTAINER_APP_ENVIRONMENT_NAME: BiteTheBookie
  RESOURCE_GROUP: BiteTheBookie
  CONTAINER_REGISTRY_NAME: bitethebookie
  CONTAINER_REGISTRY_LOGIN_SERVER: bitethebookie.azurecr.io
jobs:
  BuildAndDeployContainerApp:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.BiteTheBookie_SPN }}

    # Optional: Ensure the container app has a system-assigned identity and Key Vault access
    # (You can run these manually once and remove these steps if you prefer.)
    - name: Enable system-assigned identity for container app
      run: |
        az containerapp update \
          --name "${{ env.CONTAINER_APP_NAME }}" \
          --resource-group "${{ env.RESOURCE_GROUP }}" \
          --assign-identity
    - name: Get container app principalId
      id: getprincipal
      run: |
        principalId=$(az containerapp show --name "${{ env.CONTAINER_APP_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query "identity.principalId" -o tsv)
        echo "principalId=$principalId" >> $GITHUB_OUTPUT
    - name: Grant Key Vault secret get permission to container app identity
      # Replace <KeyVaultName> and <SecretName> with your values or set as secrets
      env:
        KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
      run: |
        az keyvault set-policy --name "$KEY_VAULT_NAME" --object-id ${{ steps.getprincipal.outputs.principalId }} --secret-permissions get

    - name: Container App deploy
      uses: azure/container-apps-deploy-action@v1
      with:
        appSourcePath: ${{ github.workspace }}
        acrName: ${{ env.CONTAINER_REGISTRY_NAME }}
        acrUsername: ${{ secrets.BiteTheBookie_USERNAME_C62C }}
        acrPassword: ${{ secrets.BiteTheBookie_PASSWORD_C62C }}
        imageToBuild: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}
        containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT_NAME }}
        resourceGroup: ${{ env.RESOURCE_GROUP }}
