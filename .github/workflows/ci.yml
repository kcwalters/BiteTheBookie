name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BiteTheBookie/BiteTheBookie.csproj

      - name: Build
        run: dotnet build BiteTheBookie/BiteTheBookie.csproj --no-restore -c Release

      - name: Test
        run: dotnet test BiteTheBookie.sln -c Release --verbosity normal
