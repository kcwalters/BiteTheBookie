name: Deploy BiteTheBookie

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: bitethebookie-rg
  LOCATION: centralus
  CONTAINER_APP_NAME: bitethebookie-container-app
  CONTAINER_APP_ENVIRONMENT_NAME: bitethebookie-env
  CONTAINER_REGISTRY_NAME: bitethebookie
  CONTAINER_REGISTRY_LOGIN_SERVER: bitethebookie.azurecr.io
  IMAGE_NAME: bitethebookie
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1. Checkout Code
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Azure Login via OIDC
      # ---------------------------
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:       
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------
      # 3. Build & Push Image to ACR
      # ---------------------------
      - name: Build and Push Image to ACR
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az acr build \
              --registry $CONTAINER_REGISTRY_NAME \
              --image $IMAGE_NAME:$IMAGE_TAG \
              .

      # ---------------------------
      # 4. Deploy Infrastructure via Bicep
      # ---------------------------
      - name: Deploy Bicep Infrastructure
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group $RESOURCE_GROUP \
              --template-file infra/main.bicep \
              --parameters \
                location=$LOCATION \
                containerAppName=$CONTAINER_APP_NAME \
                environmentName=$CONTAINER_APP_ENVIRONMENT_NAME \
                acrName=$CONTAINER_REGISTRY_NAME \
                imageName=$IMAGE_NAME \
                imageTag=$IMAGE_TAG

      # ---------------------------
      # 5. Update Container App to Latest Image
      # ---------------------------
      - name: Update Container App to latest image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name $CONTAINER_APP_NAME \
              --resource-group $RESOURCE_GROUP \
              --image $CONTAINER_REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG