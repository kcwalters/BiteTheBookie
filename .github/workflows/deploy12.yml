name: Build and deploy to Azure Container Apps (Container Apps Environment)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: containerapp-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: bitethebookieregistry.azurecr.io
  IMAGE_NAME: bitethebookie
  CONTAINER_APP_NAME: bitethebookie-app-20260501
  RESOURCE_GROUP: BiteTheBookie

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BITETHEBOOKIEAPP20260216193644_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BITETHEBOOKIEAPP20260216193644_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BITETHEBOOKIEAPP20260216193644_AZURE_SUBSCRIPTION_ID }}

      - name: Docker login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.BITETHEBOOKIEAPP20260216193644_REGISTRY_USERNAME }}
          password: ${{ secrets.BITETHEBOOKIEAPP20260216193644_REGISTRY_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build \
            --file BiteTheBookie/Dockerfile \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}" \
            .
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}