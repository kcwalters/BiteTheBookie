on:
  push:
    branches:
    - master
permissions:
  id-token: write
  contents: read
env:
  DOTNET_CORE_VERSION: 8.0.x
  CONTAINER_APP_NAME: bitethebookie-container-app
  CONTAINER_APP_ENVIRONMENT_NAME: managedEnv20260215153426
  RESOURCE_GROUP: bitethebookiev2
  CONTAINER_REGISTRY_NAME: registry20260215153736
  CONTAINER_REGISTRY_LOGIN_SERVER: registry20260215153736.azurecr.io
jobs:
  BuildAndDeployContainerApp:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Azure login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_CLIENT_ID }}
        tenant-id: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_TENANT_ID }}
        subscription-id: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_SUBSCRIPTION_ID }}

    - name: Verify Azure context and ACR
      uses: azure/cli@v2
      with:
        inlineScript: |
          set -euo pipefail
          echo "== Azure account =="
          az account show --output table
          echo "== Expected ACR =="
          echo "ACR name: ${{ env.CONTAINER_REGISTRY_NAME }}"
          echo "ACR login server: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}"
          echo "== ACR reachable? =="
          az acr show -n "${{ env.CONTAINER_REGISTRY_NAME }}" --query "{name:name, loginServer:loginServer, resourceGroup:resourceGroup}" --output table
          echo "== ACR repositories (may be empty on first run) =="
          az acr repository list -n "${{ env.CONTAINER_REGISTRY_NAME }}" --output table || true

    - name: Container App deploy
      uses: azure/container-apps-deploy-action@v1
      with:
        appSourcePath: ${{ github.workspace }}
        acrName: ${{ env.CONTAINER_REGISTRY_NAME }}
        acrUsername: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_USERNAME }}
        acrPassword: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_PASSWORD }}
        imageToBuild: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}
        containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT_NAME }}
        resourceGroup: ${{ env.RESOURCE_GROUP }}
