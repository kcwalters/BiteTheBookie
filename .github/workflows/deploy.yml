name: Build and Deploy to Azure Container Apps

# ---------------------------------------------------------------------------
# CI/CD pipeline for BiteTheBookie (ASP.NET Core / .NET 10, containerized).
#
# What it does:
#   1. build  - restores, builds and publishes the app to catch compile errors.
#   2. deploy - builds the Docker image in Azure Container Registry (ACR) and
#               rolls it out to Azure Container Apps.
#
# Deploy only runs on pushes to the default branch (master). Pull requests get
# the build/validation job only.
#
# ---------------------------------------------------------------------------
# REQUIRED SETUP (one-time) in your GitHub repo:
#   Settings > Secrets and variables > Actions
#
#   Secrets (Settings > Secrets):
#     AZURE_CLIENT_ID        - App registration (federated / OIDC) client id
#     AZURE_TENANT_ID        - Azure AD tenant id
#     AZURE_SUBSCRIPTION_ID  - Target subscription id
#
#   Variables (Settings > Variables):
#     AZURE_RESOURCE_GROUP   - Resource group name (e.g. rg-bitethebookie)
#     ACR_NAME               - Azure Container Registry name (e.g. bitethebookieacr)
#     CONTAINER_APP_NAME     - Azure Container App name (e.g. bitethebookie-app)
#
# OIDC login (recommended, no long-lived passwords) requires a federated
# credential on the app registration. See:
#   https://learn.microsoft.com/azure/developer/github/connect-from-azure
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'BiteTheBookie/BiteTheBookie.csproj'
  IMAGE_NAME: 'bitethebookie'

permissions:
  contents: read
  id-token: write   # required for Azure OIDC login

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output ${{ github.workspace }}/publish

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    # Only deploy from the default branch, never from pull requests.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        # The Dockerfile COPYs "BiteTheBookie/BiteTheBookie.csproj", so the build
        # context must be the repository root with -f pointing at the Dockerfile.
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file "BiteTheBookie/Dockerfile" \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
