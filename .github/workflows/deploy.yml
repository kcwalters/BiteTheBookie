name: Build & Deploy BiteTheBookie

on:
  push:
    branches:
      - master

env:
  ACR_NAME: btbregistry2026
  ACR_LOGIN: btbregistry2026.azurecr.io
  RG_NAME: BiteTheBookie
  LOCATION: eastus
  ENV_NAME: btb-env
  APP_NAME: bitethebookie-app
  IMAGE_NAME: bitethebookie

jobs:
  # ── Job 1: Build & Push ──────────────────────────────────────────────────────
  build:
    name: Build & Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Ensure Resource Group & ACR
        run: |
          az group create --name $RG_NAME --location $LOCATION
          az acr create \
            --resource-group $RG_NAME \
            --name $ACR_NAME \
            --sku Basic \
            --admin-enabled true || true

      - name: Build & Push Docker Image
        run: |
          az acr login --name $ACR_NAME
          docker build \
            -f BiteTheBookie/Dockerfile \
            -t $ACR_LOGIN/$IMAGE_NAME:${{ github.run_number }} \
            -t $ACR_LOGIN/$IMAGE_NAME:latest \
            .
          docker push $ACR_LOGIN/$IMAGE_NAME:${{ github.run_number }}
          docker push $ACR_LOGIN/$IMAGE_NAME:latest

  # ── Job 2: Deploy ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Ensure Container Apps Environment
        run: |
          az containerapp env create \
            --name $ENV_NAME \
            --resource-group $RG_NAME \
            --location $LOCATION || true

      - name: Create or Update Container App
        run: |
          ACR_PASSWORD=$(az acr credential show \
            --name $ACR_NAME \
            --query "passwords[0].value" \
            --output tsv)

          az containerapp update \
            --name $APP_NAME \
            --resource-group $RG_NAME \
            --image $ACR_LOGIN/$IMAGE_NAME:${{ github.run_number }} \
          || \
          az containerapp create \
            --name $APP_NAME \
            --resource-group $RG_NAME \
            --environment $ENV_NAME \
            --image $ACR_LOGIN/$IMAGE_NAME:${{ github.run_number }} \
            --registry-server $ACR_LOGIN \
            --registry-username $ACR_NAME \
            --registry-password "$ACR_PASSWORD" \
            --target-port 8080 \
            --ingress external \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 3 \
            --env-vars \
              OddsApi__BaseUrl="https://api.the-odds-api.com/v4/" \
              OddsApi__ApiKey="${{ secrets.ODDS_API_KEY }}" \
              OddsApi__Regions="us" \
              OddsApi__Markets="h2h,spreads,totals" \
              OddsApi__OddsFormat="american" \
              OddsApi__CacheSeconds="30"

      - name: Print App URL
        run: |
          FQDN=$(az containerapp show \
            --resource-group $RG_NAME \
            --name $APP_NAME \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "✅ App URL: https://$FQDN"