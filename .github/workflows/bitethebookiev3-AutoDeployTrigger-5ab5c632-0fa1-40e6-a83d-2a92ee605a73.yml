name: Trigger auto deployment for bitethebookiev3

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/bitethebookiev3-AutoDeployTrigger-5ab5c632-0fa1-40e6-a83d-2a92ee605a73.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BITETHEBOOKIEV3_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BITETHEBOOKIEV3_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BITETHEBOOKIEV3_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BITETHEBOOKIEV3_REGISTRY_PASSWORD }}
          containerAppName: bitethebookiev3
          resourceGroup: BiteTheBookieV3
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


