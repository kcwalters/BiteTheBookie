name: Trigger auto deployment for bitethebookie-containerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/bitethebookie-containerapp-AutoDeployTrigger-2f0b6b88-22ac-417f-a65d-6420d33552ff.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BITETHEBOOKIECONTAINERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BITETHEBOOKIECONTAINERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BITETHEBOOKIECONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bitethebookie.azurecr.io
          registryUsername: ${{ secrets.BITETHEBOOKIECONTAINERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BITETHEBOOKIECONTAINERAPP_REGISTRY_PASSWORD }}
          containerAppName: bitethebookie-containerapp
          resourceGroup: BiteTheBookie
          imageToBuild: bitethebookie.azurecr.io/bitethebookie-containerapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


