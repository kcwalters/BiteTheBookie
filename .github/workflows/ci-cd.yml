name: CI/CD - Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Required for requesting the OIDC JWT used by azure/login (federated credentials).
permissions:
  id-token: write
  contents: read

env:
  # ---- Update these to match your Azure resources ----
  ACR_NAME: bitethebookieregistry                  # Azure Container Registry name (without .azurecr.io)
  IMAGE_NAME: bitethebookie                         # Repository/image name inside the ACR
  CONTAINER_APP_NAME: bitethebookieca              # Azure Container App name
  RESOURCE_GROUP: BiteTheBookie-rg                  # Resource group containing the Container App (verify this!)
  CONTAINER_ENV_NAME: bitethebookie-env            # Container Apps managed environment name
  LOCATION: eastus                                  # Azure region for created resources
  DOCKERFILE_PATH: BiteTheBookie/Dockerfile         # Dockerfile location
  BUILD_CONTEXT: .                                  # Build context = repo root (Dockerfile copies BiteTheBookie/*)

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: vars
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.vars.outputs.tag }}" \
            --image "$IMAGE_NAME:latest" \
            --file "$DOCKERFILE_PATH" \
            "$BUILD_CONTEXT"

      - name: Verify Container Apps infrastructure exists
        run: |
          # Make sure the containerapp CLI extension is available.
          az extension add --name containerapp --upgrade --only-show-errors

          # Infrastructure (resource group, Log Analytics workspace, Container Apps
          # environment, and the Container App itself with its ACR-pull identity) is
          # provisioned ONCE via .github/setup-azure-oidc.ps1, which is run with
          # elevated credentials. The pipeline's OIDC principal is scoped to the
          # resource group and only builds/updates the app, so it verifies rather
          # than creates these resources.
          if ! az containerapp env show --name "$CONTAINER_ENV_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "::error::Container Apps environment '$CONTAINER_ENV_NAME' not found in '$RESOURCE_GROUP'. Run .github/setup-azure-oidc.ps1 first."
            exit 1
          fi
          if ! az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "::error::Container App '$CONTAINER_APP_NAME' not found in '$RESOURCE_GROUP'. Run .github/setup-azure-oidc.ps1 first."
            exit 1
          fi

      - name: Configure app secrets and environment variables
        run: |
          # Store sensitive values as Container App secrets.
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              sql-connection-string="${{ secrets.SQL_CONNECTION_STRING }}" \
              azure-openai-api-key="${{ secrets.AZURE_OPENAI_API_KEY }}"

          # Map config keys to env vars (.NET hierarchy uses "__").
          # Secret-backed values use the "secretref:" syntax; non-secret values are inline.
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=secretref:sql-connection-string" \
              "AzureOpenAI__ApiKey=secretref:azure-openai-api-key" \
              "AzureOpenAI__Endpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              "AzureOpenAI__DeploymentName=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
              "ASPNETCORE_ENVIRONMENT=Production"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

      - name: Azure logout
        if: always()
        run: az logout
