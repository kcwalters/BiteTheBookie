name: CI/CD - Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Required for requesting the OIDC JWT used by azure/login (federated credentials).
permissions:
  id-token: write
  contents: read

env:
  # ---- Update these to match your Azure resources ----
  ACR_NAME: bitethebookieregistry                  # Azure Container Registry name (without .azurecr.io)
  IMAGE_NAME: bitethebookie                         # Repository/image name inside the ACR
  CONTAINER_APP_NAME: bitethebookieca              # Azure Container App name
  RESOURCE_GROUP: BiteTheBookie-rg                  # Resource group containing the Container App (verify this!)
  CONTAINER_ENV_NAME: bitethebookie-env            # Container Apps managed environment name
  LOCATION: eastus                                  # Azure region for created resources
  DOCKERFILE_PATH: BiteTheBookie/Dockerfile         # Dockerfile location
  BUILD_CONTEXT: .                                  # Build context = repo root (Dockerfile copies BiteTheBookie/*)

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: vars
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ steps.vars.outputs.tag }}" \
            --image "$IMAGE_NAME:latest" \
            --file "$DOCKERFILE_PATH" \
            "$BUILD_CONTEXT"

      - name: Ensure Container Apps environment and app exist
        run: |
          # Make sure the containerapp CLI extension and required providers are available.
          az extension add --name containerapp --upgrade --only-show-errors
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

          # Ensure the resource group exists.
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --only-show-errors

          # Ensure the Container Apps managed environment exists (idempotent).
          if ! az containerapp env show --name "$CONTAINER_ENV_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Creating Container Apps environment $CONTAINER_ENV_NAME..."
            az containerapp env create \
              --name "$CONTAINER_ENV_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION"
          fi

          # Ensure the Container App exists (idempotent). Created with a system-assigned
          # identity that pulls from ACR; the deploy step updates it to the new image.
          if ! az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Creating Container App $CONTAINER_APP_NAME..."
            az containerapp create \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENV_NAME" \
              --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.vars.outputs.tag }}" \
              --registry-server "$ACR_NAME.azurecr.io" \
              --registry-identity system \
              --target-port 8080 \
              --ingress external \
              --system-assigned
          fi

      - name: Ensure ACR pull access for the Container App
        run: |
          # Guarantee the app has a system-assigned identity.
          az containerapp identity assign \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --system-assigned

          PRINCIPAL_ID=$(az containerapp identity show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query principalId -o tsv)

          ACR_ID=$(az acr show --name "$ACR_NAME" --query id -o tsv)

          # Grant AcrPull to the app identity (idempotent; ignores "already exists").
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$ACR_ID" \
            --only-show-errors || true

          # Point the app at ACR using its managed identity for pulls.
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_NAME.azurecr.io" \
            --identity system

      - name: Configure app secrets and environment variables
        run: |
          # Store sensitive values as Container App secrets.
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              sql-connection-string="${{ secrets.SQL_CONNECTION_STRING }}" \
              azure-openai-api-key="${{ secrets.AZURE_OPENAI_API_KEY }}"

          # Map config keys to env vars (.NET hierarchy uses "__").
          # Secret-backed values use the "secretref:" syntax; non-secret values are inline.
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=secretref:sql-connection-string" \
              "AzureOpenAI__ApiKey=secretref:azure-openai-api-key" \
              "AzureOpenAI__Endpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              "AzureOpenAI__DeploymentName=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
              "ASPNETCORE_ENVIRONMENT=Production"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

      - name: Azure logout
        if: always()
        run: az logout
