name: Build and Deploy BiteTheBookie

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

env:
  ACR_NAME: btbregistry2026
  IMAGE_NAME: bitethebookie
  IMAGE_TAG: latest
  RESOURCE_GROUP: BiteTheBookie
  CONTAINER_APP: bitethebookie-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image via ACR
        working-directory: BiteTheBookie
        run: |
          az acr build \
            --registry "${{ env.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            .

      - name: Deploy to Azure Container Apps
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=$CONNECTION_STRING" \
              "AzureOpenAI__ApiKey=$OPENAI_API_KEY" \
              "OddsApi__ApiKey=$ODDS_API_KEY"
