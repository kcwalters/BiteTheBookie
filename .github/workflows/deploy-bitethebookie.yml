# ============================================================
# CONFIGURATION
# ============================================================
$subscriptionId = "e1d9ef80-dcea-41ea-b053-ea32d3530915"
$resourceGroup = "BiteTheBookie"
$containerApp = "bitethebookie-app"
$acrName = "btbregistry2026"
$imageName = "bitethebookie"
$imageTag = "latest"
$location = "eastus"

# ============================================================
# LOGIN
# ============================================================
Write-Host "Logging into Azure..."
az login
az account set --subscription $subscriptionId

# ============================================================
# ACR LOGIN
# ============================================================
Write-Host "Logging into ACR..."
az acr login --name $acrName

# ============================================================
# BUILD & PUSH IMAGE
# ============================================================
Write-Host "Building and pushing image to ACR..."
az acr build `
  --registry $acrName `
  --image "$imageName:$imageTag" `
  .

# ============================================================
# DEPLOY TO AZURE CONTAINER APPS
# ============================================================
Write-Host "Deploying to Azure Container Apps..."
az containerapp update `
  --name $containerApp `
  --resource-group $resourceGroup `
  --image "$acrName.azurecr.io/$imageName:$imageTag" `
  --set-env-vars `
    ConnectionStrings__DefaultConnection="Data Source=tcp:bitethebookiebettingodds.database.windows.net,1433;Initial Catalog=bitethebookiebettingodds;User ID=kwalters;Password=Spindletop$#110;Connect Timeout=30;Encrypt=True;Trust Server Certificate=True;Application Intent=ReadWrite;Multi Subnet Failover=False;Command Timeout=30;" `
