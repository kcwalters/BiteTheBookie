name: Build and Deploy to Azure Container Apps (OIDC)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: btbregistry2026
  IMAGE_NAME: bitethebookie

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -------------------------
    # 🔐 Azure Login (OIDC)
    # -------------------------
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # -------------------------
    # 🏗️ Build & Push via ACR (server-side build; uses ./BiteTheBookie/Dockerfile)
    # -------------------------
    - name: Build and push image via ACR
      run: |
        az acr build \
          --registry "$REGISTRY" \
          --image "$IMAGE_NAME:${{ github.sha }}" \
          --file BiteTheBookie/Dockerfile \
          .

    # -------------------------
    # 🚀 Deploy to Azure Container Apps
    # -------------------------
    - name: Deploy to Azure Container Apps
      env:
        CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
        OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        SEED_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
        SEED_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      run: |
        az containerapp update \
          --name bitethebookie \
          --resource-group BiteTheBookie \
          --image "$REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
          --set-env-vars \
            "ConnectionStrings__DefaultConnection=$CONNECTION_STRING" \
            "AzureOpenAI__ApiKey=$OPENAI_API_KEY" \
            "OddsApi__ApiKey=$ODDS_API_KEY" \
            "SeedAdmin__Email=$SEED_EMAIL" \
            "SeedAdmin__Password=$SEED_PASSWORD"
