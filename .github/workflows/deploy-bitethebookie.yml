name: Build and Deploy to Azure Container Apps (OIDC)

on:
  push:
    branches: [ "master" ]
    # Only build/deploy when source, Dockerfile, or this workflow changes.
    paths:
      - "BiteTheBookie/**"
      - ".github/workflows/deploy-bitethebookie.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Prevent overlapping deployments from racing to shift traffic.
# Queue runs instead of cancelling an in-flight production deploy.
concurrency:
  group: deploy-bitethebookie
  cancel-in-progress: false

env:
  REGISTRY: bitethebookieregistry
  IMAGE_NAME: bitethebookie
  RESOURCE_GROUP: BiteTheBookie
  APP_NAME: bitethebookie-app
  # Container Apps environment + region used when the app must be created.
  CONTAINERAPP_ENV: bitebookie
  LOCATION: centralus
  # Port the container listens on (ASP.NET Core container default is 8080).
  TARGET_PORT: "8080"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Gate production deploys behind an Environment so you can add
    # required reviewers / protection rules in the repo settings.
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # -------------------------
    # ✅ Build & test gate (fail fast before touching Azure)
    # -------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore BiteTheBookie.sln

    - name: Build
      run: dotnet build BiteTheBookie.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test BiteTheBookie.sln --configuration Release --no-build --verbosity normal

    # -------------------------
    # 🔐 Azure Login (OIDC)
    # -------------------------
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # -------------------------
    # 🏗️ Build & Push via ACR (server-side build; uses ./BiteTheBookie/Dockerfile)
    # Tags each image with the commit SHA (immutable) and 'latest'.
    # -------------------------
    - name: Build and push image via ACR
      run: |
        set -euo pipefail
        az acr build \
          --registry "$REGISTRY" \
          --image "$IMAGE_NAME:${{ github.sha }}" \
          --image "$IMAGE_NAME:latest" \
          --file BiteTheBookie/Dockerfile \
          .

    # -------------------------
    # 🚀 Deploy to Azure Container Apps
    # -------------------------
    - name: Deploy to Azure Container Apps
      env:
        CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
        OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        SEED_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
        SEED_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      run: |
        set -euo pipefail

        IMAGE="$REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
        REVISION_SUFFIX="sha-${GITHUB_SHA::7}-${{ github.run_number }}"

        # Make sure the containerapp CLI extension is available/current.
        az extension add --name containerapp --upgrade --only-show-errors || true

        # Ensure the resource group exists.
        if ! az group show --name "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
          echo "Creating resource group $RESOURCE_GROUP in $LOCATION..."
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --only-show-errors
        fi

        # Ensure the Container Apps environment exists.
        if ! az containerapp env show \
              --name "$CONTAINERAPP_ENV" \
              --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
          echo "Creating Container Apps environment $CONTAINERAPP_ENV..."
          az containerapp env create \
            --name "$CONTAINERAPP_ENV" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" --only-show-errors
        fi

        # Robustly detect whether the app already exists. Use a list name-query
        # (returns a count) rather than `show`, which can exit non-zero for
        # reasons other than "not found" and cause a false create attempt.
        APP_COUNT=$(az containerapp list \
          --resource-group "$RESOURCE_GROUP" \
          --query "length([?name=='$APP_NAME'])" -o tsv 2>/dev/null || echo "0")

        if [ "${APP_COUNT:-0}" != "0" ]; then
          echo "Container App exists — updating."

          # Ensure the app runs a single active revision so traffic always
          # shifts to the newest deployment automatically.
          az containerapp revision set-mode \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --mode single

          # Store sensitive values as Container Apps secrets rather than
          # plaintext env vars in the revision definition.
          az containerapp secret set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              "connection-string=$CONNECTION_STRING" \
              "openai-api-key=$OPENAI_API_KEY" \
              "odds-api-key=$ODDS_API_KEY" \
              "seed-email=$SEED_EMAIL" \
              "seed-password=$SEED_PASSWORD"

          # Deploy the image built from this commit as a new revision.
          # In single revision mode, Container Apps automatically routes
          # 100% of traffic to this newest revision. The suffix includes the
          # run number so re-running the same commit never collides.
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --set-env-vars \
              "ConnectionStrings__DefaultConnection=secretref:connection-string" \
              "AzureOpenAI__ApiKey=secretref:openai-api-key" \
              "OddsApi__ApiKey=secretref:odds-api-key" \
              "SeedAdmin__Email=secretref:seed-email" \
              "SeedAdmin__Password=secretref:seed-password"
        else
          echo "Container App does not exist — creating."

          # Validate existence of required secrets before trying to create.
          if [ -z "$SEED_EMAIL" ] || [ -z "$SEED_PASSWORD" ]; then
            echo "Error: SEED_EMAIL and SEED_PASSWORD must be defined and non-empty in GitHub Secrets. Aborting." >&2
            exit 1
          fi

          # Create the app with a system-assigned identity used to pull from ACR,
          # secrets for sensitive values, and env vars referencing those secrets.
          az containerapp create \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$CONTAINERAPP_ENV" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --target-port "$TARGET_PORT" \
            --ingress external \
            --registry-server "$REGISTRY.azurecr.io" \
            --registry-identity system \
            --secrets \
              "connection-string=$CONNECTION_STRING" \
              "openai-api-key=$OPENAI_API_KEY" \
              "odds-api-key=$ODDS_API_KEY" \
              "seed-email=$SEED_EMAIL" \
              "seed-password=$SEED_PASSWORD" \
            --env-vars \
              "ConnectionStrings__DefaultConnection=secretref:connection-string" \
              "AzureOpenAI__ApiKey=secretref:openai-api-key" \
              "OddsApi__ApiKey=secretref:odds-api-key" \
              "SeedAdmin__Email=secretref:seed-email" \
              "SeedAdmin__Password=secretref:seed-password"

          # New apps default to single revision mode already, but set it
          # explicitly so behavior matches the update path.
          az containerapp revision set-mode \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --mode single
        fi

    # -------------------------
    # 🩺 Verify the new revision became healthy
    # -------------------------
    - name: Verify deployment health
      run: |
        set -euo pipefail
        REVISION_NAME="$APP_NAME--sha-${GITHUB_SHA::7}-${{ github.run_number }}"
        echo "Waiting for revision $REVISION_NAME to become healthy..."

        for i in $(seq 1 30); do
          STATE=$(az containerapp revision show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION_NAME" \
            --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")

          HEALTH=$(az containerapp revision show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$REVISION_NAME" \
            --query "properties.healthState" -o tsv 2>/dev/null || echo "Unknown")

          echo "Attempt $i: provisioningState=$STATE healthState=$HEALTH"

          if [ "$STATE" = "Provisioned" ] && { [ "$HEALTH" = "Healthy" ] || [ "$HEALTH" = "None" ]; }; then
            echo "Revision is healthy. ✅"
            exit 0
          fi

          if [ "$STATE" = "Failed" ]; then
            echo "Revision provisioning failed. ❌"
            exit 1
          fi

          sleep 10
        done

        echo "Timed out waiting for revision to become healthy. ❌"
        exit 1
