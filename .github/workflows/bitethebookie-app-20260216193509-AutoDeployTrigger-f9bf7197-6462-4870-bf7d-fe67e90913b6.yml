name: Trigger auto deployment for bitethebookie-app-20260216193509

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/bitethebookie-app-20260216193509-AutoDeployTrigger-f9bf7197-6462-4870-bf7d-fe67e90913b6.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BITETHEBOOKIEAPP20260216193509_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BITETHEBOOKIEAPP20260216193509_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BITETHEBOOKIEAPP20260216193509_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bitethebookie20260216193956.azurecr.io
          registryUsername: ${{ secrets.BITETHEBOOKIEAPP20260216193509_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BITETHEBOOKIEAPP20260216193509_REGISTRY_PASSWORD }}
          containerAppName: bitethebookie-app-20260216193509
          resourceGroup: BiteTheBookie
          imageToBuild: bitethebookie20260216193956.azurecr.io/bitethebookie-app-20260216193509:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


